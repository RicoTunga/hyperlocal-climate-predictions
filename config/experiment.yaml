# Experiment settings: data splits and evaluation choices. Code reads these; never hard-code.
# Decided in docs/PROJECT_CONTEXT.md section 6 (Option B). Ask before changing.

splits:
  train:      {start: 2016-01-01, end: 2023-12-31}
  validation: {start: 2024-01-01, end: 2024-12-31}
  test:       {start: 2025-01-01, end: 2026-09-30}   # final reporting only; code refuses to touch it

# Minimum number of clear days between the last target day of one split and the first
# target day of the next (at least the longest forecast horizon).
gap_days: 7

rain:
  wet_threshold_mm: 1.0        # wet day = at least 1 mm
  exceedance_mm: [10, 25]      # also reported

climatology:
  window_days: 15              # pool +/- 15 calendar days around each day of year

# Features built by src/features/build.py. Every feature on day t uses data up to day t only.
features:
  rain_lags: [1, 3, 7, 14]           # rainfall k days before day t
  rain_windows: [7, 14]              # rolling mean, std, min, max and wet-day count, ending on day t
  rain_long_window: 30               # rolling mean only (slow "how wet has it been" signal)
  era5_vars: [rh_pct, tcc, t2m_c, d2m_c, sp_hpa, wind_ms]
  era5_lags: [1, 3, 7]
  era5_windows: [7, 14]              # rolling mean and std
  tendency_vars: [rh_pct, sp_hpa, t2m_c]   # change since the previous day
  neighbourhood_sizes: [3, 5]        # squares of k x k pixels (3 = ~15 km, 5 = ~25 km)
  pixel_batch: 100                   # pixels processed at a time (memory)
