<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyperlocal forecasts · Nakuru &amp; Busia</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="map" role="region" aria-label="Forecast map"></div>

  <!-- top-left: what you are looking at -->
  <header class="panel brand" id="brand">
    <div class="eyebrow">Hyperlocal forecast · 5 km</div>
    <div class="seg" role="radiogroup" aria-label="Site" id="site-seg">
      <button role="radio" data-site="nakuru">Nakuru</button>
      <button role="radio" data-site="busia">Busia</button>
    </div>
    <div class="headline" id="headline">&nbsp;</div>
    <div class="subline" id="subline">&nbsp;</div>
    <div class="badge" title="Kenya Meteorological Department is the forecasting authority">
      Research replay · not an official forecast
    </div>
    <div class="user-row" id="user-row" hidden>
      <span class="user-name" id="user-name"></span>
      <button class="user-link" id="open-users" hidden>Users</button>
      <button class="user-link" id="sign-out">Sign out</button>
    </div>
  </header>

  <!-- right: layers and views -->
  <nav class="panel rail" aria-label="Layers">
    <div class="rail-group">
      <div class="rail-title">Rain</div>
      <button class="layer" data-layer="rain1"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg><span>Chance ≥ 1 mm</span></button>
      <button class="layer" data-layer="rain10"><svg viewBox="0 0 24 24"><path d="M8 4c2 3 4 5 4 7.5a4 4 0 0 1-8 0C4 9 6 7 8 4zM16 9c2 3 4 5 4 7.5a4 4 0 0 1-8 0c0-2.5 2-4.5 4-7.5z"/></svg><span>Heavy ≥ 10 mm</span></button>
      <button class="layer" data-layer="rain25"><svg viewBox="0 0 24 24"><path d="M5 13a5 5 0 0 1 5-7 6 6 0 0 1 11 3 4 4 0 0 1-1 8H7a4 4 0 0 1-2-4zM8 19l-1 3M12 19l-1 3M16 19l-1 3"/></svg><span>Very heavy ≥ 25 mm</span></button>
      <button class="layer" data-layer="rainmm"><svg viewBox="0 0 24 24"><path d="M7 3h10v18H7zM7 9h4M7 13h6M7 17h4"/></svg><span>Expected amount</span></button>
    </div>
    <div class="rail-group">
      <div class="rail-title">Air</div>
      <button class="layer" data-layer="rh"><svg viewBox="0 0 24 24"><path d="M3 9c3-2 6 2 9 0s6-2 9 0M3 14c3-2 6 2 9 0s6-2 9 0M3 19c3-2 6 2 9 0s6-2 9 0"/></svg><span>Humidity</span></button>
    </div>
    <div class="rail-group" id="crop-group">
      <div class="rail-title">Crops</div>
      <button class="layer" data-layer="blight_hutton"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15M5 19l8-8"/></svg><span>Late blight</span></button>
      <button class="layer" data-layer="blight_humid"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15M9 15c2-1 4-3 5-5"/></svg><span>Blight · humidity only</span></button>
    </div>
    <div class="rail-group">
      <div class="rail-title">Show</div>
      <div class="seg seg-v" role="radiogroup" aria-label="View" id="view-seg">
        <button role="radio" data-view="forecast">Forecast</button>
        <button role="radio" data-view="observed">Observed</button>
        <button role="radio" data-view="error">Error</button>
        <button role="radio" data-view="normal">Normal</button>
      </div>
      <label class="toggle"><input type="checkbox" id="cells-toggle"><span>5 km squares</span></label>
    </div>
    <div class="rail-group rail-links">
      <button class="link" id="open-skill">How good is it?</button>
      <button class="link" id="open-about">About &amp; caveats</button>
    </div>
  </nav>

  <!-- bottom-left: legend -->
  <div class="panel legend" id="legend" aria-live="polite"></div>

  <!-- bottom: timeline -->
  <footer class="panel timeline" aria-label="Timeline">
    <div class="tl-controls">
      <button class="icon" id="prev-day" aria-label="Previous issue day" title="Previous issue day ( ← )"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon play" id="play" aria-label="Play through days ahead" title="Play (space)"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button class="icon" id="next-day" aria-label="Next issue day" title="Next issue day ( → )"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="tl-issue">
      <label for="issue-input" class="tl-label">Issued</label>
      <input type="date" id="issue-input">
    </div>
    <div class="tl-track">
      <input type="range" id="issue-range" min="0" max="0" step="1" aria-label="Issue date">
      <div class="tl-months" id="tl-months"></div>
    </div>
    <div class="tl-days" role="radiogroup" aria-label="Days ahead" id="day-pills"></div>
  </footer>

  <div class="readout" id="readout" hidden></div>

  <!-- right drawer: one pixel (meteogram) -->
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Location detail">
    <div class="drawer-head">
      <div>
        <div class="eyebrow">Selected location</div>
        <div class="drawer-title" id="drawer-title"></div>
      </div>
      <button class="icon" id="close-drawer" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal" id="skill-modal" hidden role="dialog" aria-modal="true" aria-labelledby="skill-title">
    <div class="modal-card wide">
      <div class="modal-head"><h2 id="skill-title">How good is it?</h2><button class="icon close-modal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="skill-body"></div>
    </div>
  </div>
  <div class="modal" id="users-modal" hidden role="dialog" aria-modal="true" aria-labelledby="users-title">
    <div class="modal-card">
      <div class="modal-head"><h2 id="users-title">Users</h2><button class="icon close-modal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="users-body"></div>
    </div>
  </div>
  <div class="modal" id="about-modal" hidden role="dialog" aria-modal="true" aria-labelledby="about-title">
    <div class="modal-card">
      <div class="modal-head"><h2 id="about-title">About &amp; caveats</h2><button class="icon close-modal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body prose" id="about-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
